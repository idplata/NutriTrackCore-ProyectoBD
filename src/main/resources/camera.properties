# Configuraci\u00f3n de la c\u00e1mara de NutriTrack Core
# Servidor de subida desde el celular (Java)
upload.port=8085
upload.timeout.seconds=120
upload.max.bytes=10485760

# Servicio de visi\u00f3n (Python, solo en este PC)
vision.url=http://127.0.0.1:8000
vision.analyze.timeout.seconds=30
vision.estimate.timeout.seconds=5

# Arranque autom\u00e1tico del servicio
vision.autostart=true
vision.start.timeout.seconds=60
ml.folder=ml
# stub_service (respuestas fijas) o vision_service (modelo real)
vision.module=stub_service

# Por debajo de esta confianza la fila muestra "Revisa la cantidad"
confidence.low=0.4